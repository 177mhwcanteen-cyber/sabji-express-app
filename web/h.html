<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>सब्ज़ी एक्सप्रेस · आपका हिसाब</title><meta name="theme-color" content="#0d1a33"><link rel="icon" href="icon.png"><link rel="stylesheet" href="fonts/fonts.css">
<style>:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mut:#6e6e73;--line:#e3e3e8;--acc:#e04a00;--ok:#1f8a3c}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#9a9aa1;--line:#38383a;--acc:#ff8a3d;--ok:#30d158}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Mukta","Noto Sans Devanagari",system-ui,sans-serif}
header{background:linear-gradient(135deg,#0d1a33,#1b3566);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px;text-align:center}
header img{width:56px;height:56px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}h1{font:800 24px "Baloo 2",sans-serif;margin:6px 0 0}
main{max-width:560px;margin:-14px auto 24px;padding:0 14px}.c{background:var(--card);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.bal{text-align:center}.bal b{display:block;font:800 40px "Baloo 2",sans-serif;color:var(--acc)}.mut{color:var(--mut);font-size:13px}
.pay{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#ff9a4d,#f2640f 55%,#e04a00);color:#fff;font-weight:800;font-size:18px;border-radius:16px;padding:14px;margin:12px 0 0;box-shadow:0 8px 20px rgba(224,74,0,.35)}
#qr{display:flex;justify-content:center;margin:12px 0 4px}#qr img,#qr canvas{background:#fff;padding:8px;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}td.r{text-align:right;white-space:nowrap;font-weight:700}.u{color:var(--acc)}.j{color:var(--ok)}
.err{text-align:center;padding:30px 10px}</style></head><body>
<header><img src="icon.png" alt=""><h1>सब्ज़ी एक्सप्रेस</h1><div class="mut" style="color:#cfe0ff">आपका पूरा हिसाब</div></header>
<main id="m"><div class="c err">⏳ हिसाब आ रहा है…</div></main>
<script src="config.js"></script><script src="lib/qrcode.min.js"></script>
<script>
(async function(){const C=(window.SE_CONFIG||{}).firebase||{};const t=new URLSearchParams(location.search).get("t")||"";const m=document.getElementById("m");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const V=v=>{if(!v)return null;if("stringValue"in v)return v.stringValue;if("integerValue"in v)return +v.integerValue;if("doubleValue"in v)return v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("arrayValue"in v)return (v.arrayValue.values||[]).map(V);if("mapValue"in v){const o={};Object.entries(v.mapValue.fields||{}).forEach(([k,x])=>o[k]=V(x));return o}return null};
const rs=n=>"₹"+(Math.round((+n||0)*100)/100).toLocaleString("en-IN");const fd=d=>d?d.slice(8,10)+"-"+d.slice(5,7)+"-"+d.slice(0,4):"";
if(!/^[a-z0-9]{12,32}$/.test(t)){m.innerHTML='<div class="c err">❌ लिंक सही नहीं है</div>';return}
try{const r=await fetch("https://firestore.googleapis.com/v1/projects/"+C.projectId+"/databases/(default)/documents/pub/"+t+"?key="+C.apiKey);if(!r.ok)throw 0;
  const d=V({mapValue:{fields:(await r.json()).fields||{}}});if(d.type!=="hisab")throw 0;const b=+d.bal||0;
  const up="upi://pay?pa="+encodeURIComponent(d.upi||"")+"&pn="+encodeURIComponent(d.payee||"Sabji Express")+(b>0?"&am="+b:"")+"&cu=INR&tn="+encodeURIComponent("Sabji Express hisab");
  const E=(d.entries||[]).slice().reverse();
  m.innerHTML=`<div class="c bal"><div>नमस्ते <b style="display:inline;font:inherit;color:inherit">${esc(d.name)}</b> जी</div><div class="mut">आज तक का बाकी</div><b>${rs(b)}</b>
   ${b>0?`<a class="pay" href="${up}">📱 UPI से अभी चुकाएँ · ${rs(b)}</a><div id="qr"></div><div class="mut">या यह QR किसी भी UPI ऐप से स्कैन करें</div>`:'<p style="color:var(--ok);font-weight:800">✓ कोई बाकी नहीं — धन्यवाद 🙏</p>'}
   <p class="mut">हिसाब बना: ${new Date(+d.ts||Date.now()).toLocaleString("hi-IN")}</p></div>
   <div class="c"><h3 style="margin:0 0 6px">📒 तारीख-वार हिसाब</h3><table>${E.map(x=>`<tr><td>${fd(x.d)}<div class="mut">${x.t==="udhar"?(x.o?"पुराना बाकी":"सब्ज़ी · बिल "+esc(x.b)):"जमा · "+(x.m==="upi"?"UPI":"नकद")}</div></td><td class="r ${x.t==="udhar"?"u":"j"}">${x.t==="udhar"?"+":"−"}${rs(x.a)}</td></tr>`).join("")||'<tr><td>कोई एंट्री नहीं</td></tr>'}</table></div>
   <p class="mut" style="text-align:center">🥬 सब्ज़ी एक्सप्रेस · जालीपा कैंट, बाड़मेर</p>`;
  if(b>0&&window.QRCode)new QRCode(document.getElementById("qr"),{text:up,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});
}catch(e){m.innerHTML='<div class="c err">❌ हिसाब नहीं मिला — लिंक पुराना हो सकता है। गाड़ी वाले भाई से नया लिंक माँगें।</div>'}})();
</script></body></html>
